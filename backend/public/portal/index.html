<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex">
  <title>Solia Health partner portal</title>
  <link rel="stylesheet" href="/portal/portal.css">
  <script type="module" src="/portal/portal.js"></script>
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  <header class="top">
    <div class="top-in">
      <p class="brandmark"><span class="mark">Solia Health</span> <span class="mark-sub">Partner portal</span></p>
      <div id="who" class="who"></div>
    </div>
    <nav id="nav" class="nav" aria-label="Portal" hidden></nav>
  </header>
  <main id="main" tabindex="-1">
    <noscript><p class="note">The partner portal needs JavaScript.</p></noscript>
  </main>
  <p id="status" class="sr-only" role="status" aria-live="polite"></p>
  <footer class="foot">
    <p>Business information only: brands, products, the people who edit them, and for Solia Health's owners, subscription numbers, promotions, free Pro grants by account email and partner codes. The portal never shows or stores anyone's health data.</p>
  </footer>
</body>
</html>
