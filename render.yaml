# Render blueprint — the static app plus the backend it proxies through.
# In Render: New > Blueprint, point at your repo, then paste secrets under each
# service's Environment tab (sync: false entries are never read from this file).
services:
  - type: web
    name: cyra-health
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # 22: @capacitor/cli (a devDependency since the iOS/Android wrap) declares engines node >=22.
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE
        value: https://cyra-backend.onrender.com
      # Published Terms and Privacy Policy (https://…), linked from the consent step. Public, not
      # secret, but set per deployment: paste them under this service's Environment tab.
      # Unset = the build warns and the app says the documents "aren't published yet". When set, the build fetches each URL and fails unless it serves a document.
      - key: VITE_TERMS_URL
        sync: false
      - key: VITE_PRIVACY_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

  - type: web
    name: cyra-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Production: with no return allowlist, web sign-in/connect returns are refused rather than open to any site.
      - key: NODE_ENV
        value: production
      # The web app, the iOS app's web view (capacitor://localhost) and the Android app's (https://localhost).
      # Web sign-in/connect returns use the http(s) entries minus the web-view origins (or RETURN_ORIGINS if set).
      - key: CORS_ORIGIN
        value: "https://cyra-health.onrender.com,capacitor://localhost,https://localhost"
      # URL scheme the phone app is sent back to after sign-in / connecting a wearable.
      - key: APP_RETURN_SCHEMES
        value: cyrahealth
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: TERRA_DEV_ID
        sync: false
      - key: TERRA_API_KEY
        sync: false
      - key: TERRA_SIGNING_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Where the backend keeps data/push.json (web reminder subscriptions) and data/pulse.json
      # (weekly counts). Unset = ./data on the instance's own disk, which Render wipes on every
      # deploy and restart. Set it to a persistent disk's mount path (a disk needs a paid instance)
      # once one is attached; until then, those two files are lost on each deploy.
      - key: DATA_DIR
        sync: false
