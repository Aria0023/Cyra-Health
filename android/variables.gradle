ext {
    // 26, not the Capacitor template's 24: androidx.health.connect:connect-client 1.1.0
    // supports Android 8 (API 26) and up, and a library minSdk above the app's fails the
    // manifest merge. Health Connect itself only runs on Android 9 (API 28) and up; on
    // API 26-27 Cyra installs and CyraHealth.available() reports false.
    minSdkVersion = 26
    compileSdkVersion = 36
    targetSdkVersion = 36
    androidxActivityVersion = '1.11.0'
    androidxAppCompatVersion = '1.7.1'
    androidxCoordinatorLayoutVersion = '1.3.0'
    androidxCoreVersion = '1.17.0'
    androidxFragmentVersion = '1.8.9'
    coreSplashScreenVersion = '1.2.0'
    androidxWebkitVersion = '1.14.0'
    junitVersion = '4.13.2'
    androidxJunitVersion = '1.3.0'
    androidxEspressoCoreVersion = '3.7.0'
    cordovaAndroidVersion = '14.0.1'
    // Health Connect client: latest stable (developer.android.com/jetpack/androidx/releases/health-connect).
    // Known limitation: 1.1.0 was promoted unchanged from 1.1.0-rc03 (July 16, 2025), so it lacks
    // "Add backwards compatibility support for Skin Temperature" (1.2.0-alpha01, July 30, 2025).
    // On phones where Health Connect is the separate APK (Android 13 and lower) the skin-temperature
    // feature most likely reports unavailable, so CyraHealth returns temp = null there and the
    // temperature insights (ovulation confirmation, night-sweat signature) never fire. Move to
    // 1.2.x once it is stable, after checking its AAR metadata (minSdk / minCompileSdk).
    healthConnectVersion = '1.1.0'
    // Same value @capacitor/filesystem defaults to; it reads rootProject.ext.kotlinxCoroutinesVersion.
    kotlinxCoroutinesVersion = '1.10.2'
}
