# Render blueprint — the static site (the website at "/" and the web app under /app/) plus the backend it proxies through.
# In Render: New > Blueprint, point at your repo, then paste secrets under each
# service's Environment tab (sync: false entries are never read from this file).
services:
  - type: web
    name: cyra-health
    runtime: static
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    envVars:
      # 22: @capacitor/cli (a devDependency since the iOS/Android wrap) declares engines node >=22.
      - key: NODE_VERSION
        value: "22"
      # Also where the Shop downloads its published catalog (GET /api/shop/catalog, edited in the partner portal at
      # <backend>/portal/); without it the app shows the catalog it was built with.
      - key: VITE_API_BASE
        value: https://cyra-backend.onrender.com
      # Sign-in is required by default (VITE_REQUIRE_SIGNIN unset = "true"); set "false" to offer it with a skip.
      - key: VITE_REQUIRE_SIGNIN
        value: "true"
      # The guest window (src/lib/guest.js): hours she can use the app after "Try it first" before sign-in is asked.
      # Unset = 48; "0" = no guest window (sign-in first, no skip). Only applies where sign-in is required.
      - key: VITE_GUEST_HOURS
        value: "48"
      # VITE_FEATURES unset = the shipping defaults (Ask Cyra's AI, browser reminders, sign-in, wearables, and deviceSync: the on-phone
      # Apple Health / Health Connect sources in the phone app, no server module). To offer more (wearables, counts,
      # signin, cloudBackup; .env.example), set it here AND add the matching module to backend/config/app.json.
      # Published Terms and Privacy Policy (https://…), linked from the consent step. Public, not
      # secret, but set per deployment: paste them under this service's Environment tab.
      # Unset = the build warns and the app says the documents "aren't published yet". When set, the build fetches each URL and fails unless it serves a document.
      # Optional: the support address shown in You → Help (a mail link). Unset = no link. Public, not a secret.
      - key: VITE_SUPPORT_EMAIL
        sync: false
      # The website's download buttons (site/pages/home.mjs) and the app's "Get Solia Health Pro in the app" buttons read
      # the same two store addresses (https://…). Unset = the website says "Coming soon to the App Store" / "Coming soon
      # to Google Play" as plain text, never a dead link. VITE_APP_STORE_ID (the app's numeric Apple id) also adds Apple's
      # Smart App Banner to the website's front page. Public, not secrets: paste them under this service's Environment tab.
      - key: VITE_APP_STORE_URL
        sync: false
      - key: VITE_PLAY_STORE_URL
        sync: false
      - key: VITE_APP_STORE_ID
        sync: false
      - key: VITE_TERMS_URL
        sync: false
      - key: VITE_PRIVACY_URL
        sync: false
    # One site, two parts (docs/plans/website.md, 2026-11-26): the website at "/" and the web app under /app/
    # (scripts/build-web.mjs). The browser revalidates the two shells, both workers and the manifest; hashed
    # /app/assets/* keep the host default. /sw.js is the retiring worker of the app's old address (site/static/sw.js),
    # /app/sw.js the app's offline worker (public/sw.js, spec A14.1). These lists are pinned by src/lib/site.test.mjs
    # against site/build/hosting.mjs, which the local preview and the e2e server follow.
    headers:
      - path: /
        name: Cache-Control
        value: no-cache
      - path: /index.html
        name: Cache-Control
        value: no-cache
      - path: /sw.js
        name: Cache-Control
        value: no-cache
      - path: /app/
        name: Cache-Control
        value: no-cache
      - path: /app/index.html
        name: Cache-Control
        value: no-cache
      - path: /app/sw.js
        name: Cache-Control
        value: no-cache
      - path: /app/manifest.webmanifest
        name: Cache-Control
        value: no-cache
    # Only the app's own deep links are rewritten (Render tries this after looking for a file). There is no catch-all:
    # an unknown address gets 404.html with status 404, and /legal/* are plain files.
    routes:
      - type: rewrite
        source: /app/*
        destination: /app/index.html

  - type: web
    name: cyra-backend
    runtime: node
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      # Production: with no return allowlist, web sign-in/connect returns are refused rather than open to any site.
      - key: NODE_ENV
        value: production
      # The web app, the iOS app's web view (capacitor://localhost) and the Android app's (https://localhost).
      # Web sign-in/connect returns use the http(s) entries minus the web-view origins (or RETURN_ORIGINS if set).
      - key: CORS_ORIGIN
        value: "https://cyra-health.onrender.com,capacitor://localhost,https://localhost"
      # URL scheme the phone app is sent back to after sign-in / connecting a wearable.
      - key: APP_RETURN_SCHEMES
        value: cyrahealth
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: ADMIN_KEY
        sync: false
      - key: AUTH_SECRET
        sync: false
      # Partner portal (shop module, 2026-11-15): the owners' sign-in addresses, comma-separated (e.g. you@yourdomain).
      # Owners sign in at <backend>/portal/ with an emailed code (RESEND_API_KEY + EMAIL_FROM below) and invite partners
      # there. Unset = no one can sign in to the portal; the app's published catalog still works. Not a secret, but
      # personal: paste it under this service's Environment tab.
      - key: ADMIN_EMAILS
        sync: false
      # Partner portal → Subscriptions, Promotions, Pro grants (subscriptions module, 2026-11-15). The SECRET key stays
      # on this service only (never the static site, never a VITE_ variable). Unset = the portal says "not configured".
      - key: REVENUECAT_SECRET_KEY
        sync: false
      - key: REVENUECAT_PROJECT_ID
        sync: false
      - key: REVENUECAT_ENTITLEMENT
        value: pro
      # Partner portal → Affiliates (insights module, 2026-11-19): your Impact partner account's Account SID and Auth
      # Token (Impact → Settings → API). The token is a secret and stays on this service only. Unset = the page says
      # "Impact isn't connected" and nothing is requested. Amazon Associates needs no variable (its report is uploaded).
      - key: IMPACT_ACCOUNT_SID
        sync: false
      - key: IMPACT_AUTH_TOKEN
        sync: false
      # Sign-in (required since 2026-11-12): config/app.json mounts oauth and accounts, so the Apple / Google /
      # Facebook keys below and RESEND_API_KEY + EMAIL_FROM are needed in production. config/app.json also mounts
      # integrations (wearables on by default), so the Oura and Terra keys are needed for those rows to connect.
      # RESEND_API_KEY + EMAIL_FROM also send the owners' weekly report (insights module, 2026-11-19): Mondays 14:00 UTC to
      # ADMIN_EMAILS unless changed or switched off in the portal → Weekly report. ANTHROPIC_API_KEY (above) writes its
      # short summary; without it the report is a plain template. Its "sent" stamp is data/insights_weekly.json (DATA_DIR).
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: APPLE_CLIENT_ID
        sync: false
      - key: APPLE_TEAM_ID
        sync: false
      - key: APPLE_KEY_ID
        sync: false
      - key: APPLE_PRIVATE_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: FACEBOOK_APP_ID
        sync: false
      - key: FACEBOOK_APP_SECRET
        sync: false
      - key: OURA_CLIENT_ID
        sync: false
      - key: OURA_CLIENT_SECRET
        sync: false
      - key: TERRA_DEV_ID
        sync: false
      - key: TERRA_API_KEY
        sync: false
      - key: TERRA_SIGNING_SECRET
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
      # Where the backend keeps data/push.json (web reminder subscriptions), data/accounts.json and
      # data/account_sessions.json (sign-in accounts: on an ephemeral disk every account is lost on each deploy, so set
      # this to a persistent disk before launch), data/shop_taps.json (the anonymous shop tap totals) and
      # data/insights_*.json (the uploaded Amazon totals), the partner portal's data/shop_*.json and data/shop-images/ (brands,
      # products, partners, uploads: on an ephemeral disk every portal edit is lost on each deploy and the bundled
      # catalog is imported again) and, only when the pulse
      # module is listed in config/app.json, data/pulse.json (weekly counts). Unset = ./data on the
      # instance's own disk, which Render wipes on every deploy and restart. Set it to a persistent
      # disk's mount path (a disk needs a paid instance) once one is attached; until then, those
      # files are lost on each deploy.
      - key: DATA_DIR
        sync: false
