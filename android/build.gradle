// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    // Kotlin for the app's CyraHealth (Health Connect) plugin. The Kotlin-based Capacitor
    // plugins (@capacitor/filesystem, @capacitor/local-notifications) read
    // rootProject.ext.kotlin_version too, so every module compiles with this one version.
    // 2.3.21 is the newest 2.3.x patch; Kotlin's compatibility table lists 2.3.20-2.3.21 as
    // fully supporting Gradle 7.6.3-9.3.0 and AGP 8.2.2-9.0.0 (this build: Gradle 8.14.3, AGP 8.13.0).
    ext.kotlin_version = '2.3.21'

    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
